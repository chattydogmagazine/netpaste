<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#4C8DF6"/>
      <stop offset="55%" stop-color="#2F6BD8"/>
      <stop offset="100%" stop-color="#1E9E8A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#06213f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#sheen)"/>

  <!-- the mark: one sheet of text handed to another, across a link -->
  <g filter="url(#drop)">
    <!-- back sheet (the machine it came from) -->
    <rect x="236" y="250" width="300" height="392" rx="46" ry="46"
          fill="#ffffff" fill-opacity="0.55"/>

    <!-- front sheet (the machine it landed on) -->
    <rect x="432" y="330" width="356" height="444" rx="52" ry="52" fill="#ffffff"/>
    <g fill="#2F6BD8">
      <rect x="500" y="430" width="220" height="34" rx="17"/>
      <rect x="500" y="506" width="220" height="34" rx="17"/>
      <rect x="500" y="582" width="140" height="34" rx="17"/>
    </g>
  </g>

  <!-- the link: three nodes, because it is more than one machine -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.95">
    <path d="M272 760 C 272 862, 356 862, 420 862"/>
  </g>
  <circle cx="272" cy="742" r="46" fill="#FFFFFF"/>
  <circle cx="272" cy="742" r="20" fill="#2F6BD8"/>
  <circle cx="452" cy="862" r="38" fill="#FFFFFF"/>
  <circle cx="452" cy="862" r="16" fill="#1E9E8A"/>
</svg>
